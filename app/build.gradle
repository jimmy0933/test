plugins { id 'com.android.application' }
android {
 namespace 'tw.mediaorganizer'
 compileSdk 35
 defaultConfig { applicationId 'tw.mediaorganizer'; minSdk 30; targetSdk 35; versionCode 8; versionName '1.7.1' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 buildFeatures { buildConfig false }
 signingConfigs { localTesting { storeFile file('../signing/local-testing.p12'); storePassword 'mediaorganizer-dev'; keyAlias 'mediaorganizer'; keyPassword 'mediaorganizer-dev' } }
 buildTypes { debug { signingConfig signingConfigs.localTesting }; release { signingConfig signingConfigs.localTesting; minifyEnabled false } }
}
dependencies { implementation 'org.tensorflow:tensorflow-lite:2.16.1'; implementation 'androidx.recyclerview:recyclerview:1.3.2'; implementation 'androidx.appcompat:appcompat:1.7.0'; constraints { implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") { because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib") }; implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") { because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib") } } }
