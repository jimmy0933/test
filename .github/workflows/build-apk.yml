name: Build signed APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:

      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Run similarity tests
        run: |
          mkdir -p dist
          set -o pipefail && bash tests/run-tests.sh | tee dist/test-results.txt

      - name: Build signed Release APK
        run: |
          gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g :app:assembleRelease

      - name: Run Emulator Smoke Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          script: |
            set -e
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -W tw.mediaorganizer/.MainActivity
            sleep 5
            CRASH=$(adb logcat -d | grep -E "FATAL EXCEPTION" || true)
            if [[ -n "$CRASH" ]]; then /bin/false; else echo "Smoke test passed"; fi

      - name: Copy Release APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk dist/Media-Organizer.apk

      - name: Verify signature, metadata, model, and native libraries
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            dist/Media-Organizer.apk > dist/apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            dist/Media-Organizer.apk > dist/apk-metadata.txt
          (cd dist && sha256sum Media-Organizer.apk > Media-Organizer.apk.sha256)
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import zipfile

          metadata = Path("dist/apk-metadata.txt").read_text()
          assert "name='tw.mediaorganizer'" in metadata, metadata
          assert "sdkVersion:'30'" in metadata, metadata
          assert "targetSdkVersion:'35'" in metadata, metadata
          expected_model = Path("app/src/main/assets/mobilefacenet.tflite").read_bytes()
          with zipfile.ZipFile("dist/Media-Organizer.apk") as apk:
              model = apk.read("assets/mobilefacenet.tflite")
              assert model == expected_model, "APK model differs from source"
              packaged_abis = {p.split("/")[1] for p in apk.namelist()
                               if p.startswith("lib/") and p.endswith(".so")}
              required_abis = {"arm64-v8a", "armeabi-v7a", "x86", "x86_64"}
              assert required_abis <= packaged_abis, packaged_abis
          run_url = ("https://github.com/" + os.environ["GITHUB_REPOSITORY"]
                     + "/actions/runs/" + os.environ["GITHUB_RUN_ID"])
          Path("dist/build-info.txt").write_text(
              "Source commit: " + os.environ["GITHUB_SHA"] + "\n"
              + "Build run: " + run_url + "\n"
              + "Model SHA-256: " + hashlib.sha256(model).hexdigest() + "\n"
              + "Native libraries: " + ", ".join(sorted(packaged_abis)) + "\n"
              + "Scope: logic tests and APK packaging; no Android device UI tests.\n")
          print("PASS APK package, SDK levels, model, and four native ABIs")
          PY

      - name: Upload APK and verification results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Media-Organizer-APK
          path: dist/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Commit verified APK to packaging branch
        if: startsWith(github.ref, 'refs/heads/codex/package-apk-') && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Package signed APK and verification results"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: latest-build
          name: Latest APK Build
          files: dist/Media-Organizer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
